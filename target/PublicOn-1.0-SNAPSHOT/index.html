<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PublicOn | Connect Your World</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CSS/index.css">
</head>

<body>
    <nav class="navbar">
        <div class="logo-area">
            <img src="Images/PB.png" alt="PublicOn Logo">
            <h1>PublicOn</h1>
        </div>
    </nav>

    <main class="hero">
        <div class="hero-content">

            <div class="hero-badge">
                <span class="badge-dot"></span>
                Your network. Your world.
            </div>

            <h2>
                Start your
                <span>Journey</span>
                by your Network!
            </h2>

            <p class="hero-description">
                Connect with people, share your moments, and build
                meaningful connections with your network.
            </p>

            <div class="auth-buttons">
                <a href="UserAuthPages/login.html" class="auth-btn login-btn">
                    Login
                    <span class="arrow">→</span>
                </a>

                <a href="UserAuthPages/signup.html" class="auth-btn signup-btn">
                    Sign Up
                    <span class="arrow">→</span>
                </a>
            </div>

        </div>
    </main>
</body>


<script>
    function loadData() {
        fetch('${pageContext.request.contextPath}/your-servlet-endpoint', {
            method: 'GET',
            headers: {
                // This forces ngrok to skip the warning page
                'ngrok-skip-browser-warning': 'true' 
            }
        })
        .then(response => response.json())
        .then(data => {
            console.log("Data loaded:", data);
        });
    }
</script>

</html>
