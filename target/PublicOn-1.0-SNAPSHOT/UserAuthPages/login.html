<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="../CSS/login.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web App</title>
</head>

<body>

    <nav id="nav" class="navbar">
        <div class="logo-area">
            <img src="../Images/PB.png" width="80">
            <h1>PublicOn</h1>
        </div>
    </nav>


    <form action="../LoginServlet" method="post">
        <div class="form" id="FRM">

            <div class="form-area" id="formArea">

                <div class="login-form" id="LoginForm">
                    <h1>Login</h1>

                    <div class="login-input-holder">
                        <input type="email" class="email-input" id="LogiEmailINP" name="emailIn" placeholder="Email" required/><br>
                        <input type="password" class="password-input" id="LoginPassINP" name="passIn" placeholder="Password " required/>
                    </div>
                    <div class="login-checkbox-holder">
                        <label class="checkbox-row">
                            <input type="checkbox">
                            <span>Remember me</span>
                        </label>
                    </div>
                    
                    <button type="submit" class="login-btn" id="LoginBTN">Login</button>

                    <h2>Don't have an account? <a href="signup.html">Sign Up</a></h2>
                </div>
                
            </div>
            
        </div>
    </form>

</body>

<script src="../JS/login.js"></script>

</html>
